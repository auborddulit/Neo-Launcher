name: Neo Launcher CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleAospOmegaDebug --continue 2>&1 | tee build.log

      # Report compiler errors as a single annotation so they are readable from the PR.
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|\* What went wrong|FAILURE|Execution failed|AAPT|resource .* not found' build.log \
            | sed 's#/home/runner/work/[^/]*/[^/]*/##' | head -c 60000 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build errors::${msg}"

      - name: Save name of our Artifact
        id: set-result-artifact
        run: |
          ARTIFACT_PATHNAME_APK=$(ls build/outputs/apk/aospOmega/debug/*.apk | head -n 1)
          ARTIFACT_NAME_APK=$(basename $ARTIFACT_PATHNAME_APK)
          echo "ARTIFACT_NAME_APK is ${ARTIFACT_NAME_APK}"
          echo "artifact_pathname_apk=${ARTIFACT_PATHNAME_APK}" >> $GITHUB_OUTPUT
          echo "artifact_name_apk=${ARTIFACT_NAME_APK}" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.set-result-artifact.outputs.artifact_name_apk }}
          path: ${{ steps.set-result-artifact.outputs.artifact_pathname_apk }}